      <!-- FORMULÁRIO DE CADASTRO DE NOVO LOJISTA -->

            <input 
              type="text" 
              id="regName" 
              required 
              onkeydown="if(event.key==='Enter'){event.preventDefault();handleRegister(event);}"
              placeholder="Ex: João da Silva" 
              class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-3.5 py-2.5 text-xs sm:text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1" for="regStoreName">Nome do Comércio / Empresa *</label>

            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/></svg>
            <input 
              type="text" 
              id="regStoreName" 
              required 
              onkeydown="if(event.key==='Enter'){event.preventDefault();handleRegister(event);}"
              placeholder="Ex: Pastelaria Sabores de Pilar"

        <div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1" for="regEmail">Seu E-mail para Acesso *</label>

            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <input 
              type="email" 
              id="regEmail" 
              required 
              onkeydown="if(event.key==='Enter'){event.preventDefault();handleRegister(event);}"

              class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-3.5 py-2.5 text-xs sm:text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
            >
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1" for="regPassword">Criar Senha (mínimo 6 caracteres) *</label>
          <div class="relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input 
              type="password" 
              id="regPassword" 
              required 
              minlength="6"
              onkeydown="if(event.key==='Enter'){event.preventDefault();handleRegister(event);}"
              placeholder="Digite uma senha forte" 
              class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-10 py-2.5 text-xs sm:text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
            >
            <button type="button" onclick="togglePassVisibility('regPassword', 'regEyeIcon')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none">
              <span id="regEyeIcon" class="w-4 h-4 block">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400 hover:text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </span>
            </button>
          </div>
        </div>

        <!-- ALERTA LOCAL DIRETO ACIMA DO BOTÃO (VISÍVEL NO MOBILE MESMO COM SCROLL) -->
        <div id="btnAlert" class="hidden mb-2 text-xs font-bold p-3 rounded-xl"></div>

        <button 
          type="submit" 
          onclick="handleRegister(event)"
          id="btnRegSubmit"
          class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-extrabold text-xs sm:text-sm py-3.5 rounded-xl transition shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2 cursor-pointer mt-2"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
          <span>Criar Minha Conta de Lojista</span>
        </button>

        <div class="pt-4 border-t border-slate-100 text-center">
          <p class="text-xs text-slate-500 mb-2">Já possui uma conta?</p>
          <a href="entrar.html" class="inline-flex items-center justify-center gap-2 w-full py-2.5 px-4 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 text-xs font-bold transition no-underline">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
            <span>Entrar com Minha Conta</span>
          </a>
        </div>
      </form>

    </div>
  </main>

  <!-- RODAPÉ SIMPLES -->
  <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200 bg-white">
    <p>© 2026 Achei em Pilar — O Guia Comercial de Pilar & Chã do Pilar • AL</p>
  </footer>

  <!-- SCRIPT DE AUTENTICAÇÃO COM SUPABASE -->
  <script>
    const SUPABASE_URL = 'https://qivnfhxcbzgfuroihvcd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpdm5maHhjYnpnZnVyb2lodmNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MTc4NzEsImV4cCI6MjEwNzM5Mzg3MX0.0HdFcvj5_9MRdq03Ii-qUk4PG6B_mR0vmt_dxU9Q3CU';
    
    let supabaseClient = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch(err) {
      console.error('Erro ao conectar ao Supabase:', err);
    }

    function safeCreateIcons() {
      try {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      } catch(e) {}
    }

    function togglePassVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        if (icon) {
          icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`;
        }
      } else {
        input.type = 'password';
        if (icon) {
          icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400 hover:text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
        }
      }
    }

    function showAlert(msg, type = 'error') {
      const box = document.getElementById('alertBox');
      const text = document.getElementById('alertMessage');
      const icon = document.getElementById('alertIcon');
      const btnAlert = document.getElementById('btnAlert');

      // 1. Alerta direto acima do botão (sempre visível no mobile onde o usuário está olhando)
      if (btnAlert) {
        btnAlert.innerText = msg;
        if (type === 'error') {
          btnAlert.className = 'mb-2 p-3 rounded-xl text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200 block text-center animate-pulse';
        } else {
          btnAlert.className = 'mb-2 p-3 rounded-xl text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-200 block text-center';
        }
      }

      // 2. Alerta do topo
      if (box && text) {
        text.innerText = msg;
        if (type === 'error') {
          box.className = 'mb-4 p-3.5 rounded-2xl text-xs font-semibold flex items-start gap-2.5 bg-rose-50 text-rose-800 border border-rose-200';
          if (icon) {
            icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-rose-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>`;
          }
        } else {
          box.className = 'mb-4 p-3.5 rounded-2xl text-xs font-semibold flex items-start gap-2.5 bg-emerald-50 text-emerald-800 border border-emerald-200';
          if (icon) {
            icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
          }
        }
        box.classList.remove('hidden');
      }
    }

    function clearAlert() {
      const box = document.getElementById('alertBox');
      const btnAlert = document.getElementById('btnAlert');
      if (box) box.classList.add('hidden');
      if (btnAlert) btnAlert.classList.add('hidden');
    }

    async function handleRegister(e) {
      if (e) {
        if (typeof e.preventDefault === 'function') e.preventDefault();
        if (typeof e.stopPropagation === 'function') e.stopPropagation();
      }
      clearAlert();

      const btn = document.getElementById('btnRegSubmit');
      const originalBtnHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg><span>Criar Minha Conta de Lojista</span>`;

      // 1. Feedback visual imediato ao tocar
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Criando sua conta...`;
      }

      function restoreBtn() {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = originalBtnHTML;
        }
      }

      const nameEl = document.getElementById('regName');
      const storeNameEl = document.getElementById('regStoreName');
      const whatsappEl = document.getElementById('regWhatsapp');
      const emailEl = document.getElementById('regEmail');
      const passwordEl = document.getElementById('regPassword');

      const name = nameEl ? nameEl.value.trim() : '';
      const storeName = storeNameEl ? storeNameEl.value.trim() : '';
      const whatsapp = whatsappEl ? whatsappEl.value.replace(/\D/g, '') : '';
      const email = emailEl ? emailEl.value.trim() : '';
      const password = passwordEl ? passwordEl.value : '';

      // Validação rápida com feedback visível
      if (!name) {
        restoreBtn();
        showAlert('Por favor, informe seu nome completo.');
        if (nameEl) nameEl.focus();
        return false;
      }

      if (!storeName) {
        restoreBtn();
        showAlert('Por favor, informe o nome do seu comércio.');
        if (storeNameEl) storeNameEl.focus();
        return false;
      }

      if (!whatsapp || whatsapp.length < 8) {
        restoreBtn();
        showAlert('Por favor, informe seu WhatsApp (ex: 82 99999-9999).');
        if (whatsappEl) whatsappEl.focus();
        return false;
      }

      if (!email || !email.includes('@')) {
        restoreBtn();
        showAlert('Por favor, informe um e-mail válido.');
        if (emailEl) emailEl.focus();
        return false;
      }

      if (password.length < 6) {
        restoreBtn();
        showAlert('A senha deve ter no mínimo 6 caracteres.');
        if (passwordEl) passwordEl.focus();
        return false;
      }

      try {
        let userId = null;

        // 1. Tentar criar usuário no Supabase Auth com timeout de 4s para nunca travar
        if (supabaseClient) {
          try {
            const authPromise = supabaseClient.auth.signUp({
              email: email,
              password: password,
              options: {
                data: {
                  full_name: name,
                  store_name: storeName,
                  whatsapp: whatsapp
                }
              }
            });
            const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 4000));
            const authRes = await Promise.race([authPromise, timeoutPromise]).catch(err => ({ error: err }));

            if (authRes && authRes.data && authRes.data.user) {
              userId = authRes.data.user.id;
            } else if (authRes && authRes.error) {
              const errMsg = (authRes.error.message || '').toLowerCase();
              if (errMsg.includes('already registered') || errMsg.includes('already_exists')) {
                // Tenta autenticar se já existia
                try {
                  const { data: loginData } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                  });
                  if (loginData && loginData.user) {
                    userId = loginData.user.id;
                  }
                } catch(loginEx) {}
              }
            }
          } catch(authEx) {
            console.warn('Nota Supabase Auth:', authEx);
          }
        }

        if (!userId) {
          userId = 'usr_' + Date.now();
        }

        // 2. Salvar sessão do lojista no navegador
        const merchantUser = {
          id: userId,
          email: email,
          user_metadata: {
            full_name: name,
            store_name: storeName,
            whatsapp: whatsapp
          }
        };
        try {
          localStorage.setItem('pilar_current_merchant', JSON.stringify(merchantUser));
        } catch(lsErr) {
          console.warn('LocalStorage error:', lsErr);
        }

        // 3. Criar registro inicial da loja
        const formattedPhone = whatsapp.startsWith('55') ? whatsapp : '55' + whatsapp;
        const newStoreId = String(Date.now());
        const pin = whatsapp.slice(-4) || '1234';
        try {
          localStorage.setItem('pilar_my_store_id', newStoreId);
        } catch(e) {}

        const storePayload = {
          id: newStoreId,
          nome: storeName,
          categoria: 'delivery',
          bairro: 'Chã do Pilar',
          endereco: 'Pilar - AL',
          whatsapp: formattedPhone,
          instagram: '',
          descricao: `Bem-vindo(a) à ${storeName}! Entre em contato conosco pelo WhatsApp.`,
          horario: 'Segunda a Sábado',
          logo: '',
          vip: false,
          keywords: `${storeName.toLowerCase()} pilar\n[PIN:${pin}]\n[OWNER:${userId}]\n[EMAIL:${email.toLowerCase()}]\n[STATUS:pendente]`
        };

        // Salvar no Supabase (não-bloqueante com timeout de 3s)
        if (supabaseClient) {
          try {
            await Promise.race([
              supabaseClient.from('stores').insert([storePayload]),
              new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 3000))
            ]).catch(e => console.warn('Supabase store insert notice:', e));
          } catch(dbErr) {}
        }

        // Salvar em fallback local
        try {
          const rawStores = localStorage.getItem('pilar_stores');
          let localList = rawStores ? JSON.parse(rawStores) : [];
          localList.unshift(storePayload);
          localStorage.setItem('pilar_stores', JSON.stringify(localList));
        } catch(locErr) {}

        showAlert('Conta criada com sucesso! Entrando no seu painel...', 'success');
        setTimeout(() => {
          window.location.replace('minha-loja.html');
        }, 500);

      } catch(err) {
        console.error('Erro no cadastro:', err);
        showAlert('Erro: ' + (err.message || 'Tente novamente.'));
        restoreBtn();
      }
      return false;
    }

    window.handleRegister = handleRegister;

    window.addEventListener('DOMContentLoaded', () => {
      safeCreateIcons();
      const form = document.getElementById('formRegister');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          handleRegister(e);
          return false;
        });
      }
      const btn = document.getElementById('btnRegSubmit');
      if (btn) {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          handleRegister(e);
          return false;
        });
      }
    });
  </script>
</body>
</html>

  <!-- ================= MODAL DE AVALIAÇÕES ================= -->
  <div id="reviewsModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-3 sm:p-4">

      <div class="flex items-start justify-between pb-3 border-b border-slate-100 mb-3">
        <div>
          <h3 class="font-heading font-black text-slate-900 text-base">Avaliar Estabelecimento</h3>
          <p class="text-xs text-slate-400">Compartilhe sua experiência com outros moradores.</p>
        </div>
        <button onclick="closeReviewsModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center">

      <form onsubmit="handleReviewSubmit(event)" class="space-y-3.5">

          <label class="block text-xs font-bold text-slate-700 mb-1">Quantas estrelas você dá?</label>

            <button type="button" onclick="setReviewRating(1)" class="star-btn p-1 cursor-pointer"><svg class="w-7 h-7 fill-amber-400 text-amber-400" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button>
            <button type="button" onclick="setReviewRating(2)" class="star-btn p-1 cursor-pointer"><svg class="w-7 h-7 fill-amber-400 text-amber-400" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button>
            <button type="button" onclick="setReviewRating(3)" class="star-btn p-1 cursor-pointer"><svg class="w-7 h-7 fill-amber-400 text-amber-400" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button>
            <button type="button" onclick="setReviewRating(4)" class="star-btn p-1 cursor-pointer"><svg class="w-7 h-7 fill-amber-400 text-amber-400" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button>
            <button type="button" onclick="setReviewRating(5)" class="star-btn p-1 cursor-pointer"><svg class="w-7 h-7 fill-amber-400 text-amber-400" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button>
          </div>
          <span id="starRatingLabel" class="text-[11px] font-bold text-amber-800">Excelente (5 estrelas)</span>
          <input type="hidden" id="revRating" value="5">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Seu Nome</label>
          <input type="text" id="revAuthor" required placeholder="Ex: Maria Clara" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-xs outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Seu Comentário</label>
          <textarea id="revComment" rows="3" required placeholder="O que achou do atendimento, qualidade e preços?" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-xs outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
        </div>

        <button type="submit" id="btnSubmitReview" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs py-3 rounded-xl transition shadow-sm cursor-pointer flex items-center justify-center gap-2">

  <!-- ================= MODAL LIGHTBOX DE FOTOS ================= -->
  <div id="lightboxModal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-center p-3 sm:p-6" onclick="closeLightbox(event)">
    <div class="w-full max-w-2xl flex items-center justify-between pb-3 text-white">
      <h4 id="lightboxTitle" class="font-bold text-sm truncate"></h4>
      <button onclick="closeLightbox()" class="w-8 h-8 rounded-full bg-white/20 text-white flex items-center justify-center">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
    <div class="relative max-w-2xl max-h-[80vh] flex items-center justify-center">
      <img id="lightboxImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="Foto da loja" class="max-h-[80vh] max-w-full rounded-2xl object-contain">
    </div>
  </div>

  <!-- SCRIPT PRINCIPAL DA PÁGINA DA LOJA -->
  <script>
    const SUPABASE_URL = 'https://qivnfhxcbzgfuroihvcd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpdm5maHhjYnpnZnVyb2lodmNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MTc4NzEsImV4cCI6MjEwNzM5Mzg3MX0.0HdFcvj5_9MRdq03Ii-qUk4PG6B_mR0vmt_dxU9Q3CU';
    let supabase = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch(e) {}

    let currentStore = null;
    let localStatsCache = {};
    let localReviewsCache = {};
    let localLikedStores = [];

    try {
      localStatsCache = JSON.parse(localStorage.getItem('pilar_stats_cache') || '{}');
      localReviewsCache = JSON.parse(localStorage.getItem('pilar_reviews_cache') || '{}');
      localLikedStores = JSON.parse(localStorage.getItem('pilar_liked_stores') || '[]');
    } catch(e) {}

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function extractStoreFotos(store) {
      if (!store) return [];
      if (Array.isArray(store.fotos) && store.fotos.length > 0) return store.fotos;
      if (typeof store.fotos === 'string' && store.fotos.trim()) {
        try {
          const parsed = JSON.parse(store.fotos);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        } catch(e) {
          const split = store.fotos.split(',').map(s => s.trim()).filter(Boolean);
          if (split.length > 0) return split;
        }
      }
      return [];
    }

    function buildMapsLink(store) {
      if (!store) return '';
      if (store.maps_link && store.maps_link.trim().startsWith('http')) return store.maps_link.trim();
      const query = `${store.nome}, ${store.endereco || ''}, Pilar - AL, Brasil`;
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
    }

    function getStoreGoogleRating(store) {
      if (!store) return { score: '0.0', count: 0, stars: 0 };
      const sid = String(store.id);
      const reviews = localReviewsCache[sid] || [];
      if (!Array.isArray(reviews) || reviews.length === 0) {
        return { score: '0.0', count: 0, stars: 0 };
      }
      const sum = reviews.reduce((acc, r) => acc + (Number(r.rating) || 5), 0);
      const avg = sum / reviews.length;
      return { score: avg.toFixed(1), count: reviews.length, stars: avg };
    }

    function renderGoogleStars(score, starClass = "w-3.5 h-3.5") {
      const num = Number(score) || 0;
      let starsHtml = '';
      for (let i = 1; i <= 5; i++) {
        if (num > 0 && num >= i - 0.25) {
          starsHtml += `<svg class="${starClass} fill-[#FBBC04] text-[#FBBC04] shrink-0" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
        } else if (num > 0 && num >= i - 0.75) {
          starsHtml += `<svg class="${starClass} fill-[#FBBC04] text-[#FBBC04] shrink-0 opacity-80" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
        } else {
          starsHtml += `<svg class="${starClass} fill-slate-200 text-slate-200 shrink-0" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
        }
      }
      return starsHtml;
    }

    function isStoreLiked(storeId) {
      return localLikedStores.includes(String(storeId));
    }

    function getStoreLikes(storeId) {
      return localStatsCache[storeId]?.likes || 0;
    }

    async function handleStoreLike(storeId) {
      if (isStoreLiked(storeId)) {
        alert('Você já curtiu este estabelecimento! Obrigado pelo carinho com os negócios de Pilar.');
        return;
      }
      localLikedStores.push(String(storeId));
      localStorage.setItem('pilar_liked_stores', JSON.stringify(localLikedStores));
      if (!localStatsCache[storeId]) localStatsCache[storeId] = { likes: 0 };
      localStatsCache[storeId].likes = (localStatsCache[storeId].likes || 0) + 1;
      localStorage.setItem('pilar_stats_cache', JSON.stringify(localStatsCache));

      const countEl = document.getElementById('like-count-display');
      const btnEl = document.getElementById('like-btn-display');
      if (countEl) countEl.innerText = localStatsCache[storeId].likes;
      if (btnEl) {
        btnEl.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-xl border transition bg-rose-50 text-rose-600 border-rose-200 font-black';
        const svg = btnEl.querySelector('svg');
        if (svg) svg.setAttribute('class', 'w-4 h-4 fill-rose-500 text-rose-500');
      }

      if (supabase) {
        try { await supabase.rpc('increment_store_like', { p_store_id: storeId }); } catch(e) {}
      }
    }

    async function trackClick(storeId, type) {
      if (!localStatsCache[storeId]) localStatsCache[storeId] = {};
      if (type === 'whatsapp') localStatsCache[storeId].whatsapp_clicks = (localStatsCache[storeId].whatsapp_clicks || 0) + 1;
      if (type === 'instagram') localStatsCache[storeId].instagram_clicks = (localStatsCache[storeId].instagram_clicks || 0) + 1;
      if (type === 'maps') localStatsCache[storeId].maps_clicks = (localStatsCache[storeId].maps_clicks || 0) + 1;
      localStorage.setItem('pilar_stats_cache', JSON.stringify(localStatsCache));

      if (supabase) {
        try { await supabase.rpc('increment_store_click', { p_store_id: storeId, p_click_type: type }); } catch(e) {}
      }
    }

    function openLightbox(title, imgUrl) {
      const modal = document.getElementById('lightboxModal');
      const titleEl = document.getElementById('lightboxTitle');
      const imgEl = document.getElementById('lightboxImg');
      if (titleEl) titleEl.innerText = title;
      if (imgEl) imgEl.src = imgUrl;
      if (modal) modal.classList.remove('hidden');
    }

    function closeLightbox(e) {
      if (e && e.target && e.target.closest && e.target.closest('#lightboxImg')) return;
      const modal = document.getElementById('lightboxModal');
      if (modal) modal.classList.add('hidden');
    }

    function shareStore() {
      if (!currentStore) return;
      const shareUrl = window.location.href;
      if (navigator.share) {
        navigator.share({
          title: `${currentStore.nome} — Achei em Pilar`,
          text: `Conheça ${currentStore.nome} no guia comercial de Pilar:`,
          url: shareUrl
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(shareUrl).then(() => {
          alert('Link da loja copiado com sucesso! Você já pode colar e compartilhar no WhatsApp.');
        }).catch(() => {
          window.open(`https://wa.me/?text=${encodeURIComponent(`Conheça ${currentStore.nome} no Achei em Pilar: ${shareUrl}`)}`, '_blank');
        });
      }
    }

    function renderStorePage(store) {
      currentStore = store;
      document.getElementById('pageTitle').innerText = `${store.nome} — Achei em Pilar`;
      document.getElementById('navStoreTitle').innerText = store.nome;

      const rawZap = (store.whatsapp || '').replace(/\D/g, '');
      const hasValidZap = rawZap.length >= 10 && !/^0+$/.test(rawZap);
      const zapLink = hasValidZap ? `https://wa.me/55${rawZap}?text=${encodeURIComponent(`Olá! Encontrei a ${store.nome} através do guia Achei em Pilar e gostaria de saber mais informações!`)}` : '';

      const rawInsta = (store.instagram || '').replace('@', '').trim();
      const instaClean = rawInsta.replace(/[^a-zA-Z0-9._]/g, '');

      let siteClean = (store.site || '').trim();
      if (siteClean && !siteClean.startsWith('http')) siteClean = 'https://' + siteClean;

      const mapsLink = buildMapsLink(store);
      const ratingData = getStoreGoogleRating(store);
      const isLiked = isStoreLiked(store.id);
      const likesCount = getStoreLikes(store.id);

      const CATEGORY_NAMES = {
        'delivery': 'Lanches & Delivery',
        'bolos': 'Bolos & Doces',
        'roupas': 'Roupas & Calçados',
        'beleza': 'Salão & Barbearia',
        'servicos': 'Fretes & Serviços',
        'utilidades': 'Variedades & Móveis',
        'saude': 'Farmácia & Saúde'
      };
      const categoryLabel = CATEGORY_NAMES[store.categoria] || store.categoria || 'Comércio & Serviços';

      const logoUrl = store.logo || 'https://images.unsplash.com/photo-1472851294608-062f824d29cc?auto=format&fit=crop&w=300&q=80';
      const fotos = extractStoreFotos(store);
      const coverUrl = fotos.length > 0 ? fotos[0] : logoUrl;

      // Atualiza barra inferior fixa de WhatsApp
      if (hasValidZap) {
        const zapBar = document.getElementById('floatingZapBar');
        const zapName = document.getElementById('floatingStoreName');
        const zapBtn = document.getElementById('floatingZapBtn');
        if (zapBar) zapBar.classList.remove('hidden');
        if (zapName) zapName.innerText = store.nome;
        if (zapBtn) {
          zapBtn.href = zapLink;
          zapBtn.onclick = () => trackClick(store.id, 'whatsapp');
        }
      }

      const reviews = localReviewsCache[String(store.id)] || [];

      const html = `
        <!-- BANNER DE CAPA & LOGO -->
        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden relative">
          <div class="h-44 sm:h-56 w-full bg-slate-900 relative overflow-hidden">
            <img src="${escapeHtml(coverUrl)}" alt="Capa ${escapeHtml(store.nome)}" class="w-full h-full object-cover opacity-60">

    function openReviewsModal() {
      document.getElementById('reviewsModal').classList.remove('hidden');
    }

    function closeReviewsModal() {
      document.getElementById('reviewsModal').classList.add('hidden');
    }

    function setReviewRating(val) {
      document.getElementById('revRating').value = val;
      const labels = { 5: 'Excelente (5 estrelas)', 4: 'Muito bom (4 estrelas)', 3: 'Bom (3 estrelas)', 2: 'Regular (2 estrelas)', 1: 'Ruim (1 estrela)' };
      document.getElementById('starRatingLabel').innerText = labels[val] || `${val} estrelas`;
      document.querySelectorAll('#starRatingContainer .star-btn').forEach((btn, idx) => {
        const svg = btn.querySelector('svg');
        if (idx + 1 <= val) {
          svg.setAttribute('class', 'w-7 h-7 fill-amber-400 text-amber-400');
        } else {
          svg.setAttribute('class', 'w-7 h-7 fill-slate-200 text-slate-200');
        }
      });
    }

    async function handleReviewSubmit(e) {
      e.preventDefault();
      if (!currentStore) return;
      const rating = parseInt(document.getElementById('revRating').value, 10);
      const author = document.getElementById('revAuthor').value.trim();
      const comment = document.getElementById('revComment').value.trim();

      const newRev = {
        store_id: String(currentStore.id),
        author: author,
        rating: rating,
        comment: comment,
        created_at: new Date().toISOString()
      };

      const sid = String(currentStore.id);
      if (!localReviewsCache[sid]) localReviewsCache[sid] = [];
      localReviewsCache[sid].unshift(newRev);
      localStorage.setItem('pilar_reviews_cache', JSON.stringify(localReviewsCache));

      closeReviewsModal();
      renderStorePage(currentStore);
      alert('Sua avaliação foi enviada com sucesso! Muito obrigado.');

      if (supabase) {
        try {
          await supabase.from('store_reviews').insert([{
            store_id: sid,
            author: author,
            rating: rating,
            comment: comment
          }]);
        } catch(err) {}
      }
    async function syncStoreData(storeId) {
      if (!supabase) return;
      try {
        const [statsRes, reviewsRes] = await Promise.all([
          supabase.from('store_stats').select('*').eq('store_id', storeId).maybeSingle(),
          supabase.from('store_reviews').select('*').eq('store_id', storeId)
        ]);

        let hasUpdate = false;
        if (statsRes && statsRes.data) {
          localStatsCache[storeId] = {
            whatsapp_clicks: statsRes.data.whatsapp_clicks || 0,
            instagram_clicks: statsRes.data.instagram_clicks || 0,
            maps_clicks: statsRes.data.maps_clicks || 0,
            likes: statsRes.data.likes || 0
          };
          localStorage.setItem('pilar_stats_cache', JSON.stringify(localStatsCache));
          hasUpdate = true;
        }

        if (reviewsRes && reviewsRes.data) {
          localReviewsCache[storeId] = reviewsRes.data;
          localStorage.setItem('pilar_reviews_cache', JSON.stringify(localReviewsCache));
          hasUpdate = true;
        }

        if (hasUpdate && currentStore && String(currentStore.id) === String(storeId)) {
          renderStorePage(currentStore);
        }
      } catch(e) {}
    }

    // RESOLVER DADOS DA LOJA DE FORMA INSTANTÂNEA E MULTI-ORIGEM (0ms)
    function findStoreById(storeId) {
      if (!storeId) return null;
      const targetId = String(storeId).trim();

      // a. Tentar pegar do sessionStorage se veio de um clique recente
      try {
        const sessionStore = sessionStorage.getItem('pilar_selected_store_' + targetId);
        if (sessionStore) {
          const parsed = JSON.parse(sessionStore);
          if (parsed && String(parsed.id) === targetId) return parsed;
        }
      } catch(e) {}

      // b. Tentar pegar do localStorage nas chaves mais recentes
      const keysToTry = [
        'pilar_stores_data_v9',
        'pilar_stores_data_v8',
        'pilar_stores_data_v7',
        'pilar_stores_data_v6',
        'pilar_stores_data_v5',
        'pilar_stores_data_v4',
        'pilar_stores_data_v3',
        'pilar_stores_data_v2',
        'pilar_stores_data'
      ];
      for (const k of keysToTry) {
        try {
          const raw = localStorage.getItem(k);
          if (raw) {
            const list = JSON.parse(raw);
            if (Array.isArray(list)) {
              const found = list.find(s => String(s.id) === targetId);
              if (found) return found;
            }
          }
        } catch(e) {}
      }

      // c. Tentar pegar de INITIAL_STORES (precarregados)
      if (typeof INITIAL_STORES !== 'undefined' && Array.isArray(INITIAL_STORES)) {
        const found = INITIAL_STORES.find(s => String(s.id) === targetId);
        if (found) return found;
      }
      if (typeof window.INITIAL_STORES !== 'undefined' && Array.isArray(window.INITIAL_STORES)) {
        const found = window.INITIAL_STORES.find(s => String(s.id) === targetId);
        if (found) return found;
      }

      return null;
    }

    // CARREGAR LOJA AO ENTRAR
    async function initStorePage() {
      const urlParams = new URLSearchParams(window.location.search);
      const storeId = urlParams.get('id') || urlParams.get('loja') || window.location.hash.replace('#', '');

      if (!storeId) {
        window.location.href = 'index.html';
        return;
      }

      // 1. Tentar localizar o comércio localmente de imediato (0ms de espera)
      let store = findStoreById(storeId);

      if (store) {
        // Renderiza NA HORA sem travar a tela
        renderStorePage(store);
        syncStoreData(store.id);
      }

      // 2. Se não encontrou localmente ou para atualizar com dados mais recentes do Supabase em segundo plano:
      if (supabase) {
        try {
          const fetchPromise = supabase.from('stores').select('*').eq('id', storeId).maybeSingle();
          const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject('timeout'), 4000));
          const result = await Promise.race([fetchPromise, timeoutPromise]);
          
          if (result && result.data) {
            store = result.data;
            renderStorePage(store);
            syncStoreData(store.id);
            return;
          }
        } catch(e) {
          console.warn('Nota: Supabase não retornou loja ou demorou:', e);
        }
      }

      // 3. Se mesmo após todas as tentativas a loja não existe:
      if (!store) {
        document.getElementById('storeContent').innerHTML = `
          <div class="bg-white rounded-3xl p-8 border border-slate-200 text-center space-y-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-slate-300 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
            <h2 class="font-extrabold text-base text-slate-800">Estabelecimento não encontrado</h2>
            <p class="text-xs text-slate-500">Este comércio pode ter sido atualizado ou removido do guia.</p>
            <a href="index.html" class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
              <span>Voltar para a Página Inicial</span>
            </a>
          </div>
        `;
      }
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initStorePage);
    } else {
      initStorePage();
    }
  </script>
